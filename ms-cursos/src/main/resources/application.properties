spring.application.name=ms-cursos
server.port=8082

# --- Conexión a MariaDB (XAMPP). Cada microservicio tiene su propia base de datos ---
spring.datasource.url=jdbc:mariadb://localhost:3306/ms_cursos_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
# update: crea/ajusta tablas y la clave foránea curso_id automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
