spring.application.name=ms-cursos
server.port=${SERVER_PORT:8082}

# --- Conexión a BD: en local usa los valores por defecto, en Docker se sobreescriben ---
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/ms_cursos_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


